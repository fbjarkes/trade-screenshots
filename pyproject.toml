[project]
name = "trade-screenshots"
version = "0.1.0"
description = "Generate screenshot-like trade charts with custom data, e.g. Tradingview or Alpaca data"
authors = [{ name = "fbjarkes", email = "fbjarkes-github.q5706@aleeas.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "fire>=0.6",
    "plotly>=5.17,<6",
    "kaleido==0.2.1",
    "mplfinance>=0.12.10b0",
    "finta>=1.3",
    "python-dotenv>=1.0",
    "python-utils",
]

[dependency-groups]
dev = ["black", "ruff"]

[tool.uv.sources]
python-utils = { git = "https://github.com/fbjarkes/python-utils.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trade_screenshots"]

[tool.black]
line-length = 180
skip-string-normalization = true

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
]
exclude = [
  "tests",
]
